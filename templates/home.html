<body>

    <h1>Motorshow</h1>

       <header class="header">
        <nav class="nav">
       
            <a href="/"><button class="btn">Home</button></a>
            <a href="/about"><button class="btn">About us</button></a>
            <a href="/catalog"><button class="btn">Catalog</button></a>
            
            {% if logged_in %}
            <a href="/basket"><button class="btn">Basket</button></a>
            <a href="{{ url_for('logout') if logged_in else url_for('login') }}">
                <button class="btn">
                    {{ 'Logout' if logged_in else 'Login' }}
                </button>
            </a>
            <a href="/profile"><button class="btn">{{ Profile }}</button></a>
            {% else %}
            <a href="/login"><button class="btn">Login</button></a>
            {% endif %}
            
        </nav>
    </header>

    <div class="filters">
        <input type="text" id="idSearch" placeholder="ID">
        <input type="text" id="modelSearch" placeholder="Model">
        <input type="text" id="volumeSearch" placeholder="Volume">
        <input type="text" id="priceSearch" placeholder="Price">
        <input type="text" id="yearSearch" placeholder="Year">
        <input type="text" id="mileageSearch" placeholder="Mileage">
    </div>

    <div class="car-list" id="carList">
        {% for i in cars_models %} 
        <div class="car-item">
            <span class="id">{{i.id}}</span>
            <span class="model">{{i.model}}</span>
            <span class="volume">{{i.volume}} cc</span>
            <span class="price">${{i.price}}</span>
            <span class="year">{{i.year}}</span>
            <span class="mileage">{{i.mileage}} km</span>
        </div>
        {% endfor %}
    </div>

    <script>
        const inputs = {
            id: document.getElementById('idSearch'),
            model: document.getElementById('modelSearch'),
            volume: document.getElementById('volumeSearch'),
            price: document.getElementById('priceSearch'),
            year: document.getElementById('yearSearch'),
            mileage: document.getElementById('mileageSearch')
        };

        const carItems = document.querySelectorAll('.car-item');

        function filterCars() {
            carItems.forEach(item => {
                const id = item.querySelector('.id').textContent.toLowerCase();
                const model = item.querySelector('.model').textContent.toLowerCase();
                const volume = item.querySelector('.volume').textContent.toLowerCase();
                const price = item.querySelector('.price').textContent.toLowerCase();
                const year = item.querySelector('.year').textContent.toLowerCase();
                const mileage = item.querySelector('.mileage').textContent.toLowerCase();

                const matches = 
                    id.includes(inputs.id.value.toLowerCase()) &&
                    model.includes(inputs.model.value.toLowerCase()) &&
                    volume.includes(inputs.volume.value.toLowerCase()) &&
                    price.includes(inputs.price.value.toLowerCase()) &&
                    year.includes(inputs.year.value.toLowerCase()) &&
                    mileage.includes(inputs.mileage.value.toLowerCase());

                item.style.display = matches ? 'block' : 'none';
            });
        }

        Object.values(inputs).forEach(input => {
            input.addEventListener('input', filterCars);
        });
    </script>
</body>
</html>
