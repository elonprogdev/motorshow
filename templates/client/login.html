<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/add.css')}}">
</head>
<body>
    <div class="container">
        <form action="/log_in" method="GET"  class="form-lamp">
            <h2>LOGIN</h2>

            {% with messages = get_flashed_messages() %}
            <!-- {% if messages %} -->
            <ul>
            {% for message in messages %}
            <li class="{{style}}">{{ message }}</li>
            {% endfor %} 
            </ul>
            <!-- {% else %}
            <li class="no-messages"></li>
            </ul> -->
            <!-- {% endif %} -->
            {% endwith %}

            <label for="e_mail">Email:</label>
            <input type="text" id="e_mail" name="e_mail" placeholder="Enter your email" required/>

            <label for="number">Password:</label>
            <input type="tel" id="number" name="number" placeholder="Enter your phone number" required/>
            
            <button type="submit" class="btn-add">LOGIN</button>
            <a href="/registration" class="btn-registration">New customer? Create new account</a>
        </form>
        
        <a href="/" class="btn-home">Home</a>
    </div>
</body>
</html>
